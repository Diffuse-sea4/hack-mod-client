<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuff-Inspired Custom Eagler Client</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background-color: #111;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        /* Root game canvas canvas view layout */
        #canvas-root {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            z-index: 1;
        }
        /* Floating Hack Menu Window GUI Overlay */
        #hack-menu {
            position: absolute;
            top: 30px; left: 30px;
            width: 240px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #00ffcc;
            border-radius: 8px;
            color: #fff;
            z-index: 9999;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            display: block;
        }
        .menu-header {
            background: #00ffcc;
            color: #000;
            padding: 10px;
            font-weight: 800;
            text-align: center;
            font-size: 13px;
            letter-spacing: 1.5px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            text-transform: uppercase;
        }
        .menu-content {
            padding: 12px;
        }
        .hack-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
        }
        /* Custom Switch Toggles */
        .switch {
            position: relative; display: inline-block;
            width: 36px; height: 18px;
        }
        .switch input { display: none; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .2s;
            border-radius: 18px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 12px; width: 12px;
            left: 3px; bottom: 3px;
            background-color: white; transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #00ffcc; }
        input:checked + .slider:before { transform: translateX(18px); }
        .footer-note {
            font-size: 10px; text-align: center;
            color: #555; margin-top: 12px;
            border-top: 1px solid #222; padding-top: 8px;
        }
    </style>
    <!-- Core runtime packages required to execute Eagler web assets locally -->
    <script type="text/javascript" src="https://eaglercraft.com"></script>
</head>
<body style="margin:0px;">

    <!-- ClickGUI Frame Context -->
    <div id="hack-menu">
        <div class="menu-header">TUFF GHOST CLIENT</div>
        <div class="menu-content">
            <div class="hack-row">
                <span>Fly Mod (Client)</span>
                <label class="switch">
                    <input type="checkbox" id="flyToggle" onchange="applyToggle('fly')">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="hack-row">
                <span>Speed Multiplier</span>
                <label class="switch">
                    <input type="checkbox" id="speedToggle" onchange="applyToggle('speed')">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="hack-row">
                <span>Fullbright Vision</span>
                <label class="switch">
                    <input type="checkbox" id="brightToggle" onchange="applyToggle('bright')">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="footer-note">Press [ Right-Shift ] to Toggle GUI</div>
        </div>
    </div>

    <!-- Active Native Canvas Wrapper Container Layout -->
    <div id="canvas-root">
        <canvas id="canvas" style="width:100%; height:100%; border:none;"></canvas>
    </div>

    <script type="text/javascript">
        // Global system state references for functional feature injection hooks
        const hackState = {
            fly: false,
            speed: false,
            bright: false
        };

        // Initialize Native Eagler Runtime Client configuration directly in page memory scope
        window.addEventListener("load", function() {
            if(typeof main === "function") {
                // Configure local runtime variables directly bypassing frame isolation rules
                const eaglerOpts = {
                    container: "canvas",
                    assetsURI: "https://eaglercraft.com",
                    serverList: [
                        { addr: "wss://://eaglercraft.com", name: "Official Asia Server" },
                        { addr: "wss://://eaglercraft.com", name: "Official US Server" }
                    ]
                };
                console.log("[Tuff-Client] Launching native canvas assembly context...");
                // Start the main game context assembly
                window.main(eaglerOpts);
            }
        });

        // Module Memory Manipulation Trigger
        function applyToggle(hackId) {
            hackState[hackId] = !hackState[hackId];
            console.log(`[Tuff-Client] Module updated: ${hackId} is now ${hackState[hackId]}`);
            
            // Intercept running application memory loops directly via global windows objects
            if(window.Minecraft && window.Minecraft.getMinecraft) {
                const mcInstance = window.Minecraft.getMinecraft();
                if(mcInstance && mcInstance.player) {
                    if(hackId === 'fly') {
                        mcInstance.player.capabilities.allowFlying = hackState.fly;
                        mcInstance.player.capabilities.isFlying = hackState.fly;
                    }
                }
            }
        }

        // Catch Right Shift key bind interactions explicitly across page layers
        window.addEventListener('keydown', function(event) {
            if (event.key === 'Shift' && event.location === 2) {
                const guiElement = document.getElementById('hack-menu');
                guiElement.style.display = (guiElement.style.display === 'none') ? 'block' : 'none';
            }
        });
    </script>
</body>
</html>
